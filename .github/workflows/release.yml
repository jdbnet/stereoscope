name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tag the next version
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/caarlos0/svu/v3@latest
          next="$(svu next)"
          current="$(svu current 2>/dev/null || true)"
          if [ -n "$current" ] && [ "$next" = "$current" ]; then
            echo "No release-worthy commits since $current."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$next"
          git push origin "$next"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0

      - name: Install NSIS
        run: choco install nsis -y

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264" "platform-tools"

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
