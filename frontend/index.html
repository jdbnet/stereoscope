<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StereoScope</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app"><h1>StereoScope</h1></div>
    <script>
      window.onerror = function (message, _source, line, column) {
        fetch("/__diag", { method: "POST", body: String(message) + " at " + line + ":" + column });
      };
      window.addEventListener("unhandledrejection", function (event) {
        fetch("/__diag", { method: "POST", body: "rejection " + String(event.reason) });
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
