version: 2

project_name: stereoscope

before:
  hooks:
    - go run ./scripts/prepare --version {{ .Version }}

builds:
  - id: stereoscope
    main: ./cmd/stereoscope
    binary: stereoscope
    env:
      - CGO_ENABLED=0
    tags:
      - production
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w -H windowsgui -X stereoscope/internal/version.Version={{ .Version }}

archives:
  - formats:
      - binary
    name_template: "{{ .ProjectName }}"

release:
  extra_files:
    - glob: bin/stereoscope.apk

checksum:
  name_template: checksums.txt
